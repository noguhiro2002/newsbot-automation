name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Compile Python
        run: uv run python -m compileall -q newsbot tests scripts

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check public release contents and history
        run: uv run python scripts/private_repo_check.py

      - name: Check Markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.9.0 pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image with provenance and SBOM
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: newsbot-automation:ci
          provenance: mode=max
          sbom: true

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: newsbot-automation:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
