name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.9"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Compile Python
        run: uv run python -m compileall -q newsbot tests scripts

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check public release contents and history
        run: uv run python scripts/private_repo_check.py

      - name: Check Markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.9.0 pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image with provenance and SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: newsbot-automation:ci
          provenance: mode=max
          sbom: true

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: newsbot-automation:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
