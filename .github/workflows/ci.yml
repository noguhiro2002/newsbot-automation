name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.9"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Compile Python
        run: uv run python -m compileall -q newsbot tests scripts

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check public release contents and history
        run: uv run python scripts/private_repo_check.py

      - name: Check Markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Audit Python dependencies
        run: uv run --with pip-audit==2.9.0 pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: newsbot-automation:ci
          provenance: mode=max
          sbom: true

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: newsbot-automation:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
